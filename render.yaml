services:
  - type: pserv
    name: fixflow-mysql
    runtime: docker
    region: singapore
    dockerfilePath: ./docker/mysql.Dockerfile
    dockerContext: .
    autoDeployTrigger: off
    disk:
      name: mysql-data
      mountPath: /var/lib/mysql
      sizeGB: 10
    envVars:
      - key: MYSQL_DATABASE
        value: fixflow_cms
      - key: MYSQL_USER
        value: fixflow
      - key: MYSQL_PASSWORD
        generateValue: true
      - key: MYSQL_ROOT_PASSWORD
        generateValue: true

  - type: web
    name: fixflow-cms
    runtime: docker
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /up
    preDeployCommand: php artisan migrate --force
    disk:
      name: app-storage
      mountPath: /var/www/html/storage
      sizeGB: 5
    envVars:
      - key: APP_NAME
        value: FixitNow
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        value: fixflow-mysql
      - key: DB_PORT
        value: "3306"
      - key: DB_DATABASE
        value: fixflow_cms
      - key: DB_USERNAME
        value: fixflow
      - key: DB_PASSWORD
        fromService:
          type: pserv
          name: fixflow-mysql
          envVarKey: MYSQL_PASSWORD
      - key: FILESYSTEM_DISK
        value: local
      - key: SUBSCRIPTION_PROOF_DISK
        value: local
      - key: GCASH_ACCOUNT_NAME
        sync: false
      - key: GCASH_ACCOUNT_NUMBER
        sync: false
